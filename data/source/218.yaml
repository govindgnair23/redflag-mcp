- id: 218-01
  description: A personal bank account where the account holder has no history of
    work in the food business area receives credits or makes debits on a regular basis
    from obvious food suppliers e.g. “ABC Meats Ltd” etc. This is an indication of
    a non-registered food business.
  product_types:
