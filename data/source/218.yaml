- id: 218-04
  description: A personal or business bank account that has credits that refer to
    “dinitrophenol”, “2,4 dinitrophenol” or “DNP”. This is an indication that the
    account holder is selling DNP, a dangerous chemical that is used for weight loss
    but is not intended for human consumption and has led to many fatalities.
  product_types:
