- id: 100-07
  description: 'The respondent conducts significant business with sectors that are
    associated with higher levels of ML/TF risk. For example, the respondent conducts:
    i. significant remittance business; ii. business on behalf of certain money remitters
    or exchange houses; iii. business on behalf of or with providers of crypto-assets
    services, other than CASPs regulated under Regulation (EU) 2023/1114, which are
    bound by an AML/CFT regulatory and supervisory regime that is less robust than
    the regime envisaged in Directive (EU) 2015/849 or are not subject to any AML/CFT
    obligations; iv. significant business on behalf of CASPs, for which the business
    model is focused on providing products and services described in Guideline 21.3(d);
    v. business with non-residents; or vi. business in a currency other than that
