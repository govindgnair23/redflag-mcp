- id: 100-36
  description: 'When exchanging crypto-assets to official currencies and vice versa,
    the customer: a) uses multiple bank or payment accounts, credit cards or prepaid
    cards to fund the crypto-assets account; b) uses a bank or payment account, credit
    card in the name of a different person than the customer without having evident
    links to that person; c) uses a bank or payment account located in a jurisdiction,
    which is inconsistent with the customer’s given address or location; d) uses multiple
    providers of payment services; e) repeatedly requests an exchange of crypto-assets
    to or from cash or anonymous electronic money; f) uses protocols that connect
    two blockchains, to exchange crypto-assets to other crypto-assets on a different
    network, such as Monero, Zcash or similar; g) uses Crypto-ATMs in different locations
    to repeatedly transfer funds to a bank account; h) withdraws crypto-assets from
    a CASP to a self-hosted address immediately after depositing crypto-assets or
    exchanging for different crypto-assets in a CASP'
