- id: 100-34
  description: 'Displays behaviour or transaction patterns which are not in line with
    that expected from the type of customer or the risk category to which it belongs,
    or is unexpected based on the information the customer has provided to the CASP,
    either at the start or throughout the business relationship. Such circumstances
    include the customer: a) unexpectedly and without obvious reason significantly
    increasing the volume or value of a crypto-asset transfer or combined transfers
    after a period of dormancy; b) transacting with an unusually high frequency and
    volume of crypto-assets, which is inconsistent with the purpose and nature of
    the business relationship and without an apparent economic purpose; c) increasing
    the transaction limit to an extent that is not commensurate with the customer’s
    declared income or it otherwise exceeds the expected volume of activity'
  product_types:
