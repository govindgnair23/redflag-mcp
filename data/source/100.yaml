- id: 100-40
  description: 'Repeatedly receives crypto-assets from or sends crypto-assets to:
    a) a crypto-asset account through an intermediary crypto-asset service provider,
    which does not fall within the scope of Regulation (EU) 2023/1114 or under any
    other relevant regulatory framework within or outside the EU; or which is subject
    to AML/CTF regulatory and supervisory framework that is less robust than the one
    provided for in Directive (EU) 2015/849; b) multiple self-hosted addresses or
    multiple crypto-asset accounts held by the same or different CASPs without an
    apparent economic rationale for it; c) a newly created or previously inactive
    crypto-asset account or a distributed ledger address held by a third party; d)
    self-hosted addresses on decentralised platforms, which involve the use of mixers,
    tumblers and other privacy-enhancing technologies that may obfuscate the financial
    history associated with the distributed ledger address and the source of funds
    for the transaction, therefore undermining the CASP’s ability to know its customers
    and implement effective AML/CTF systems and controls; e) a crypto-asset account
    shortly after being onboarded by the CASP, which is then followed by a withdrawal
    or a transfer from such an account in a short period of time without an apparent
    economic rationale for it; f) a crypto-asset account frequently below a defined
    threshold or, in case of transfers to a self-hosted address, below the threshold
    of EUR 1 000 as defined in Article 14(5) and Article 16(2) of the Regulation (EU)
    2023/1113; g) a crypto-asset account by splitting the transactions into multiple
    transactions which are sent to multiple distributed ledger addresses by using
    smurfing techniques'
