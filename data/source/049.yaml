- id: 049-01
  description: North Korean-flagged merchant vessels have physically altered their
    vessels to obscure their identities and attempt to pass themselves off as different
    vessels. These physical alterations include painting over vessel names and IMO
    numbers with alternate ones.
  product_types:
  - trade_finance
  - wire_transfer
  - correspondent_banking
  - insurance
  industry_types:
  - maritime_shipping
  customer_profiles:
