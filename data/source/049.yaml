- id: 049-04
  description: North Korean-flagged merchant vessels have also been known to manipulate
    the data being transmitted via AIS. Such manipulation could include altering vessel
    names, IMO numbers, Maritime Mobile Service Identities (MMSIs), or other unique
    identifying information. This tactic could also be used to conceal a vessel’s
    next port of call or other information regarding its voyage.
