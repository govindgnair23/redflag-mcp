  - east_asia
  regulatory_source: 'North Korea Sanctions Advisory: Sanctions Risks Related to North
    Korea’s Shipping Practices'
  regulator: OFAC
  regulator_jurisdiction: US
  issued_date: '2018-02-23'
  risk_level: high
  category: sanctions_evasion
