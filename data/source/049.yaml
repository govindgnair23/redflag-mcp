- id: 049-02
  description: 'North Korean Ship-to-Ship (STS) Transfers: STS transfers are a method
    of transferring cargo from one ship to another while at sea rather than while
    located in port. STS transfers can conceal the origin or destination of cargo.
    North Korea operates a fleet of tankers capable of engaging in STS transfers of
    refined petroleum products and other banned goods. The names and IMO numbers of
    these vessels are subject to change as North Korea seeks to conceal the identity
    of vessels it owns and operates.'
