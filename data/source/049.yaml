- id: 049-01
  description: 'Physically Altering Vessel Identification: Maritime vessels meeting
    certain tonnage thresholds are required to display their name and International
    Maritime Organization (IMO) number (a unique, seven-digit identifying vessel identification
    code) in a visible location either on the ship’s hull or superstructure. A vessel’s
    IMO number is intended to be permanent and should remain consistent regardless
    of a change in a vessel’s ownership or name. North Korean-flagged merchant vessels
    have physically altered their vessels to obscure their identities and attempt
    to pass themselves off as different vessels. These physical alterations include
    painting over vessel names and IMO numbers with alternate ones.'
  product_types:
