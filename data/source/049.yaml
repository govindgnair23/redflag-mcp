- id: 049-03
  description: 'Falsifying Cargo and Vessel Documents: Complete and accurate shipping
    documentation is critical to ensuring all parties to a transaction understand
    the parties, goods, and vessels involved in a given shipment. Bills of lading,
    certificates of origin, invoices, packing lists, proof of insurance, and lists
    of last ports of call are examples of documentation that typically accompany a
    shipping transaction. North Korea has been known to falsify vessel and cargo documents
    to obscure the origin or destination of cargo.'
