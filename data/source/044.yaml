- id: 044-04
  description: 'Helping companies or individuals evade U.S. sanctions on Russia’s
    military-industrial base. This includes: offering to set up alternative or non-transparent
    payment mechanisms, changing or removing customer names or other relevant information
    from payment fields, obfuscating the true purpose of or parties involved in payments,
    or otherwise taking steps to hide the ultimate purpose of transactions to evade
    sanctions.'
  product_types:
  - wire_transfer
