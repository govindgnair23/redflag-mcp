  - Iranian email service
- id: 207-14
  description: Unregistered P2P Exchangers, Foreign-Located MSBs, and Nested DASPs.
    Account activity indicates that a customer may operate as an unregistered P2P
    exchanger, foreign-located MSB, or nested DASP that provides services in Iran.
    For example, a customer of a DASP who is located in a high-risk jurisdiction for
    Iranian illicit finance-related activity appears to be using liquidity provided
    by the DASP to execute large numbers of offsetting transactions.
  product_types:
