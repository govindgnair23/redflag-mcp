- id: 207-02
  description: Irregularities in Shipping Documentation that may be Intended to Hide
    Activities Involving Iran. A customer makes oil-related transactions and wire
    transfers involving vessels that have been previously linked to suspicious financial
    activities or that include documentation, such as bills of lading or shipping
    invoices, with no consignees, that appear to be falsified, or that omit key information,
    to obfuscate the Iranian nexus.
