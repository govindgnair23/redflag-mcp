- id: 207-13
  description: Iran-related Cyber Indicators. Authentication and account activity
    indicates that a user may be conducting digital asset transactions from Iran.
    For example, activity logs may show connections from Iranian IP addresses, or
    sharing IP addresses or common devices with users previously identified as having
    an Iranian nexus, authentication using an Iranian email service or Iranian telephone
    number, or use of a device with time zone, language, and other settings consistent
    with a location in Iran. Connection through a virtual private network (VPN), residential
    proxy network, or Tor exit node—when combined with other evidence of a location
    in Iran—may indicate an attempt by an Iranian user to circumvent geofencing.
  product_types:
  - crypto
  industry_types:
  - crypto
  customer_profiles:
  - foreign_individual
  geographic_footprints:
  - iran
  regulatory_source: FinCEN Alert FIN-2026-Alert002
  regulator: FinCEN
  regulator_jurisdiction: US
  issued_date: '2026-05-11'
  risk_level: high
  category: cyber_enabled
