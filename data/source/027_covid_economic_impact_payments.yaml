- id: 027_covid_economic_impact_payments-01
  description: 'An account holder attempts to deposit one or more checks that appear
    to be issued by the U.S. Treasury, but are fraudulent or counterfeit checks. When
    questioned, the customer may disclose that he or she: (i) was sent a partial payment,
    and needed to verify his or her PII or financial information before receiving
    the full EIP; or (ii) received the check purportedly from a current or former
    employer with instructions that the check was the customer’s “stimulus payment”
    and that he or she was to buy prepaid cards and send them to another individual.'
  product_types:
  - depository
  - prepaid
  industry_types: []
  customer_profiles:
  - individual_consumer
  geographic_footprints:
  - domestic_us
  regulatory_source: FIN-2021-A002 Advisory on Financial Crimes Targeting COVID-19
    Economic Impact Payments
