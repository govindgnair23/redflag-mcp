- id: 027_covid_economic_impact_payments-02
  description: An existing account receives, or an account holder makes, multiple
    EIP-related deposits for individuals other than the account holder(s), and the
    individuals named on the checks reside outside the geographic region of the account
    holder, or do not have a history at the account holder’s purported address. This
    may be indicative of funnel account activities in which multiple EIPs are deposited
    or transferred throughout the United States into one account, which may be held
    by a fraudster or a money mule working for the fraudster.
  product_types:
  - depository
  - wire_transfer
  - prepaid
  industry_types: []
  customer_profiles:
