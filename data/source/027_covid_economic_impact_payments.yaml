- id: 027_covid_economic_impact_payments-10
  description: Deposits of one or more EIP U.S. Treasury checks or electronic deposits
    made into an account held by (a) a retail business, or (b) a personal account
    of a business owner or employee and the account holder is not the payee/endorser.
