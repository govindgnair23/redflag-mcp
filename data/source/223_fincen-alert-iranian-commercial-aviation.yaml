- id: 223_fincen-alert-iranian-commercial-aviation-03
  description: Documentation or due diligence associated with the sale of an aircraft
    indicates that the aircraft has been in storage for an extended period of time
    or has undergone frequent re-registrations, layered changes in ownership by companies
    in multiple jurisdictions, or an unusual number of moves between jurisdictions,
    particularly in Central Asia, in the lead up to the sale.
