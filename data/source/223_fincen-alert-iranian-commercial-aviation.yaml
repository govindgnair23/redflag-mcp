- id: 223_fincen-alert-iranian-commercial-aviation-04
  description: A customer with a nexus to Iran engaged in commercial aviation procurement
    claims that their activities are authorized by OFAC or BIS without providing copies
    of any OFAC or BIS authorizations, particularly if open-source aviation databases
    indicate that aircraft previously owned or handled by the company were subsequently
    transferred to Iran through one or more intermediary jurisdictions.
