- id: 223_fincen-alert-iranian-commercial-aviation-02
  description: A recently incorporated technology, aviation, or logistics company
    in a jurisdiction at high risk for transshipment to Iran lists a residential address
    as its business address, shares beneficial ownership information with an unusual
    number of other companies, or is co-located at the same physical address or shares
    a PO Box with other companies that fit a similar profile and were established
    at or around the same time.
