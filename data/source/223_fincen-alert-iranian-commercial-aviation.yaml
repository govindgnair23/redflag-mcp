- id: 223_fincen-alert-iranian-commercial-aviation-01
  description: A recently incorporated technology, aviation, or logistics company
    with an opaque ownership structure and a limited online presence in a jurisdiction
    at high risk for transshipment to Iran makes a large number of purchases of aircraft
    parts or other components that may be used in the commercial aviation industry
    from U.S. or Western technology and aeronautics companies.
