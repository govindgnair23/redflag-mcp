- id: 211-17
  description: 'Foreign visitors opening multiple U.S. bank accounts at one or more
    financial institutions. Individuals may travel to the United States with instructions
    to establish multiple bank accounts as a straw party. Upon return to their home
    country the straw account owner signs all of the blank checks and relinquishes
    control of the checkbooks and ATM cards tied to the accounts to the beneficial
    owner who now has control of the accounts. The following are examples of activity
    common to these accounts: Cash deposits received using over-the-counter deposit
    slips since the checkbooks containing the pre-printed deposit slips as well as
    ATM cards are located out of country; Deposits which are frequently made in multiple
    U.S. jurisdictions; Withdrawals made via foreign ATM transactions; or Withdrawals
    via check transactions that exhibit a difference between the handwriting for the
    signature and the payee portions of the check.'
  product_types:
  - depository
  - check_cashing
  industry_types: []
  customer_profiles:
  - foreign_individual
  - beneficial_owner_obscured
  - shell_or_front_company
  geographic_footprints:
