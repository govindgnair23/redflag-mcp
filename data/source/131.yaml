- id: 131-05
  description: 'An SVF licensee should take appropriate steps (e.g. examining the
    background and purposes of the transactions; making appropriate enquiries to or
    obtaining additional Customer Due Diligence (CDD) information from a customer)
    to identify if there are any grounds for suspicion, when: the customer’s transactions
    are not consistent with the SVF licensee’s knowledge of the customer, the customer’s
    business, risk profile and source of funds; or the SVF licensee identifies transactions
    that (i) are complex, unusually large in amount or of an unusual pattern, and
    (ii) have no apparent economic or lawful purpose.'
