- id: 131-04
  description: Countries or jurisdictions identified by credible sources, such as
    mutual evaluation or detailed assessment reports, as not having effective AML/CFT
    Systems; countries or jurisdictions identified by credible sources as having a
    significant level of corruption or other criminal activity; countries or jurisdictions
    subject to sanctions, embargoes or similar measures issued by, for example, the
    United Nations; or countries, jurisdictions or geographical areas identified by
    credible sources as providing funding or support for terrorist activities, or
    that have designated terrorist organisations operation.
