- id: 131-01
  description: 'Transactions: The following is a (non-exhaustive) list of examples
    of situations that might give rise to suspicion in certain circumstances: discrepancies
    between the information submitted by the customer and information detected by
    monitoring systems; individuals who hold an unusual volume of SVF accounts with
    the same provider; a large and diverse source of funds (i.e. bank transfers, credit
    card and cash funding from different locations) used to fund the same SVF account(s);
    multiple reference bank accounts from banks located in different jurisdictions
    used to fund the same SVF account; loading or funding of an SVF account always
    done by third parties; multiple third party funding activities of an SVF account,
    followed by the immediate transfer of funds to unrelated bank account(s); multiple
    loading or funding of the same SVF account, followed by ATM withdrawals shortly
    afterwards, over a short period of time; multiple withdrawals conducted at different
    ATMs (sometimes located in various countries different from jurisdiction where
    the SVF account was funded); an SVF account only used for withdrawals, and not
    for making payments for goods or services; an SVF account being used in multiple
    jurisdictions within days of issuance; atypical use of the SVF product (including
    unexpected and frequent cross-border access or transactions); customers who load
    or fund SVF accounts containing counterfeit notes or forged instruments; a substantial
    increase in turnover on an SVF account; reluctance to provide normal information
    when opening an SVF account, providing minimal or fictitious information or, when
    applying to open an SVF account, providing information that is difficult or expensive
    for the institution to verify; large cash withdrawals from a previously dormant/inactive
    SVF account; and structured the transactions to avoid reaching the limits for
    conducting Customer Due Diligence (CDD) for a verified customer (e.g. a few transactions
    within a short period of time with an amount just below the limit for conducting
    CDD for a verified customer, purchase of multiple non-reloadable prepaid cards
    just below the limit for conducting CDD for a verified customer by a single customer
    over a short period of time).'
