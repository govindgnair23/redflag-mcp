- id: 131-02
  description: 'Examples of potentially higher risk factors include: business relationship
    is conducted in unusual circumstances (e.g. significant unexplained geographic
    difference between the SVF licensee and the customer); nature and scope of business
    activities generating the funds/assets (e.g. merchants), having regard to high-risk
    activities; legal persons or legal arrangements that involve a shell vehicle without
    a clear and legitimate commercial purpose; the ownership structure of the legal
    person or legal arrangement appears unusual or excessively complex given the nature
    of the legal person’s or legal arrangement’s business; or companies that have
    nominee shareholders, nominee directors, bearer shares or bearer share warrants.'
