- id: 048-01
  description: The organization has failed to appreciate or consider (or, in some
    instances, actively disregarded) the fact that OFAC sanctions applied to their
    organization based on their status as a U.S. person, a U.S.-owned or controlled
    subsidiary (in the Cuba and Iran programs), or dealings in or with U.S. persons,
    the U.S. financial system, or U.S.-origin goods and technology.
  product_types:
  - depository
  - wire_transfer
  - correspondent_banking
  - trade_finance
  - securities
  industry_types: []
  customer_profiles:
  - foreign_financial_institution
  geographic_footprints:
  - iran
  - ofac_sanctioned_country
  regulatory_source: A Framework for OFAC Compliance Commitments
  regulator: OFAC
  regulator_jurisdiction: US
  risk_level: medium
  category: sanctions_evasion
  source_url: https://ofac.treasury.gov/media/16331/download?inline
- id: 048-02
  description: Organizations with foreign-based operations and subsidiaries located
    outside of the United States have engaged in transactions or activity that violated
    OFAC’s regulations by referring business opportunities to, approving or signing
    off on transactions conducted by, or otherwise facilitating dealings between their
    organization’s non-U.S. locations and OFAC-sanctioned countries, regions, or persons.
  product_types:
  - wire_transfer
