- id: 048-04
  description: Organizations have failed to update their sanctions screening software
    to incorporate updates to the SDN List or SSI List, failed to include pertinent
    identifiers such as SWIFT Business Identifier Codes for designated, blocked, or
    sanctioned financial institutions, or did not account for alternative spellings
    of prohibited countries or parties—particularly in instances in which the organization
    is domiciled or conducts business in geographies that frequently utilize such
    alternative spellings (i.e., Habana instead of Havana, Kuba instead of Cuba, Soudan
    instead of Sudan, etc.).
  product_types:
  - depository
  - wire_transfer
  - correspondent_banking
  - trade_finance
  - securities
  industry_types: []
  customer_profiles: []
  geographic_footprints:
  - caribbean
  - africa
  regulatory_source: A Framework for OFAC Compliance Commitments
  regulator: OFAC
  regulator_jurisdiction: US
  risk_level: medium
  category: sanctions_evasion
  source_url: https://ofac.treasury.gov/media/16331/download?inline
