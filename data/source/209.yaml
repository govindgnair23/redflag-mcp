- id: 209-01
  description: Non-resident aliens and foreign nationals with deposit accounts who
    are citizens of countries or jurisdictions that are identified as non-cooperative
    by the Financial Action Task Force (FATF), identified as Jurisdictions of Concern
    or Jurisdictions of Primary Concern in the U.S. Department of State’s annual International
    Narcotics Control Strategy Report (INCSR), designated as jurisdictions of primary
    money laundering concern or subject to special measures through regulations issued
    by FinCEN, pursuant to Section 311 of the USA PATRIOT Act, or sanctioned by the
    Office of Foreign Assets Control (OFAC), including those with state sponsored
    terrorism.
  product_types:
  - depository
  industry_types:
  - casinos
  customer_profiles:
