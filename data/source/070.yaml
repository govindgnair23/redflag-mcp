- id: 070-01
  description: 'Schemes involving falsified customs, shipping and trade finance documents,
    including the following: Phantom shipments: Transferring funds to buy goods that
    are never shipped, received or documented. Falsely described goods and services:
    Misrepresenting the quality, quantity, or type of goods or services traded. Multiple
    invoicing: Issuing a single invoice but receiving multiple payments. Over/under
    invoicing: Invoicing goods or services at a price above or below market value
    in order to move money or value from the exporter to the importer or vice-versa.'
  product_types:
  - trade_finance
