- id: 070-12
  description: 'A money services business owner, associate or employee does some or
    all of the following: maintains personal account activity similar to that of a
    money services business; attempts to avoid reporting obligations when exchanging
    currency on behalf of another money services business; lists multiple occupations,
    addresses and/or telephone numbers with financial institutions or online; lists
    occupation as immigration consultant, student, homemaker or unemployed; lives
    outside of their reasonable means (i.e., buys real estate beyond what they could
    reasonably afford on their claimed income); attempts to close an account(s) to
    avoid due diligence questioning; receives wires and transfers from multiple sources
    in accounts at numerous banks and credit unions; the individual then depletes
    these amounts through drafts payable to self or for real estate purchases; places
    large structured cash deposits into the same account at multiple locations on
    the same day; and is a customer at many banks and credit unions, and negotiates
    many self-addressed bank drafts from various financial institutions.'
  product_types:
