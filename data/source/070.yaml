- id: 070-05
  description: 'The entity transacts with a large number of entities that have activities
    in the above-noted sectors or have names that suggest activities in a wide range
    of unrelated sectors, and also does some or all of the following: receives a sudden
    inflow of large-value electronic funds transfers; orders electronic funds transfers
    to the benefit of China- or Hong Kong-based trading companies or individuals,
    and receives electronic funds transfers from the U.S. and Latin American countries;
    orders electronic funds transfers to the benefit of entities or individuals in
    the U.S., Mexico or Latin American countries, and receives such transfers from
    the U.S.; orders or receives electronic funds transfers to/from entities holding
    a bank account in Latvia or Cyprus, and are registered to addresses in the U.K.,
    Cyprus, the British Virgin Islands, Panama, the Seychelles, Belize, the Marshall
    Islands or other offshore financial centers; and orders or receives payments for
    goods in round figures or in increments of approximately US$50,000.'
