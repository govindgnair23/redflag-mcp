- id: 070-02
  description: 'The Black Market Peso Exchange, which typically works as follows:
    Transnational organized crime groups, such as Colombian or Mexican drug cartels,
    place proceeds of crime into the U.S. financial system through structured cash
    deposits (deposits that are organized to avoid record-keeping or reporting requirements)
    of U.S. dollars. A Colombian or Mexican importer buys those dollars from complicit
    brokers, paying for them in pesos. The importer uses the U.S. funds to purchase
    goods that are then shipped to Colombia or Mexico. The brokers return the pesos
    they received from the importer to the cartel.'
  product_types:
  - depository
  - wire_transfer
  industry_types:
  - import_export
  customer_profiles:
