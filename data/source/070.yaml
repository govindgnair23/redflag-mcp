- id: 070-11
  description: 'A Canadian money services business does some or all of the following:
    receives a sudden inflow of large electronic funds transfers and cash deposits;
    this is followed by an increased outflow of electronic funds transfers, cheques
    and bank drafts made out to multiple unrelated third parties for loans or investments,
    or to the individual conducting the transaction; undertakes numerous currency
    exchanges involving Canadian and U.S. dollars and/or Euros; carries out business
    largely with or through Iran or other countries subject to sanctions, the United
    Arab Emirates, Kuwait, Hong Kong, and China or countries with internal capital
    controls; and receives electronic funds transfers from foreign exchange and trading
    companies based in the above-noted countries for real estate transactions, loans
    or investments.'
