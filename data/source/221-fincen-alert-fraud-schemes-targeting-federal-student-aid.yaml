- id: 221-fincen-alert-fraud-schemes-targeting-federal-student-aid-09
  description: Multiple accounts are created online within a short timeframe at a
    financial institution and receive student aid refunds on a one-to-one basis (i.e.,
    one account receives one refund). These funds, in whole or part, may be rapidly
    transferred to other accounts via P2P or wire transfers, used to purchase digital
    assets, or used in transactions with online money services businesses that typically
    process international funds transfers.
