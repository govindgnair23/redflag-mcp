- id: 221-fincen-alert-fraud-schemes-targeting-federal-student-aid-01
  description: A customer who has no previous history of, or customer profile information
    that would be consistent with, enrollment at an educational institution receives
    a student aid refund, especially where the stated recipient of the refund listed
    in the transaction reference is an individual with no known connection to the
    customer. These funds are then rapidly transferred to another account via P2P
    or wire transfers, used to purchase digital assets, or used in transactions with
    online money services businesses that typically process international funds transfers.
  product_types:
  - depository
  - wire_transfer
  - money_transmitter
  - crypto
  industry_types:
  - education
  customer_profiles:
  - individual_consumer
  - newly_established_business
  geographic_footprints: []
