- id: 048-01
  description: The organization conducts, or will conduct, an OFAC risk assessment
    in a manner, and with a frequency, that adequately accounts for the potential
    risks. Such risks could be posed by its clients and customers, products, services,
    supply chain, intermediaries, counter-parties, transactions, and geographic locations,
    depending on the nature of the organization. As appropriate, the risk assessment
    will be updated to account for the root causes of any apparent violations or systemic
    deficiencies identified by the organization during the routine course of business.
  flag: False
  reasoning: This is a guideline for organizations to carry out a risk assessment, not a red flag.
  product_types: []
  industry_types: []
  customer_profiles: []
  geographic_footprints: []
  regulatory_source: A Framework for OFAC Compliance Commitments
  regulator: OFAC
  regulator_jurisdiction: US
  risk_level: low
  category: sanctions_evasion
  source_url: https://ofac.treasury.gov/media/16331/download?inline
- id: 048-02
  description: 'On-boarding: The organization develops a sanctions risk rating for
    customers, customer groups, or account relationships, as appropriate, by leveraging
    information provided by the customer (for example, through a Know Your Customer
    or Customer Due Diligence process) and independent research conducted by the organization
    at the initiation of the customer relationship. This information will guide the
    timing and scope of future due diligence efforts.'
  flag: False
  reasoning: This is a guideline or best practice for an organization, not a red flag.
