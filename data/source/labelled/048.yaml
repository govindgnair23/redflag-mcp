- id: 048-04
  description: The organization has implemented internal controls that adequately
    address the results of its OFAC risk assessment and profile. These internal controls
    should enable the organization to clearly and effectively identify, interdict,
    escalate, and report to appropriate personnel within the organization transactions
    and activity that may be prohibited by OFAC. To the extent information technology
    solutions factor into the organization’s internal controls, the organization has
    selected and calibrated the solutions in a manner that is appropriate to address
    the organization’s risk profile and compliance needs, and the organization routinely
    tests the solutions to ensure effectiveness.
  flag: False
  reasoning: This is a guideline or best practice for an organization, not a red flag.
