- id: 023_iran_backed_terrorist_financing-03
  description: A customer conducts transactions with a money services business (MSB)
    or other financial institution, including a VASP, that operates in jurisdictions
    known for, or at high risk for, terrorist activity and is reasonably believed
    to have lax customer identification and verification processes, opaque ownership,
    or otherwise fails to comply with AML/CFT best practices.
