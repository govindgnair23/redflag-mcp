- id: 023_iran_backed_terrorist_financing-05
  description: A customer that is or purports to be a charitable organization or NPO
    solicits donations but does not appear to provide any charitable services or openly
    supports terrorist activity or operations. In some cases, these organizations
    may post on social media platforms or encrypted messaging apps to solicit donations,
    including in CVC.
