- id: 023_iran_backed_terrorist_financing-01
  description: A customer or a customer’s counterparty conducts transactions with
    Office of Foreign Assets Control (OFAC)-designated entities and individuals, or
    transactions that contain a nexus to identifiers listed for OFAC-designated entities
    and individuals, to include email addresses, physical addresses, phone numbers,
    passport numbers, or CVC addresses.
