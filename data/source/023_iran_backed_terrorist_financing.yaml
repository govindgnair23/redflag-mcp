- id: 023_iran_backed_terrorist_financing-04
  description: A customer conducts transactions that originate with, are directed
    to, or otherwise involve entities that are front companies, general “trading companies”
    with unclear business purposes, or other companies whose beneficial ownership
    information indicates that they may have a nexus with Iran or other Iran-supported
    terrorist groups. Indicators of possible front companies include opaque ownership
    structures, individuals and/or entities with obscure names that direct the company,
    or business addresses that are residential or co-located with other companies.
  product_types:
  - depository
  - wire_transfer
  - correspondent_banking
  - trade_finance
  - money_transmitter
  - remittance
  industry_types:
  - import_export
