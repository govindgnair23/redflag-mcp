- id: 052-20
  description: Be vigilant for unauthorized, small-scale transactions that may be
    fraudulently conducted by contracted IT workers. In one case, DPRK IT workers
    employed as developers by a U.S. company fraudulently charged the U.S. company’s
    payment account and stole over USD 50,000 in 30 small installments over a matter
    of months. The U.S. company was not aware the developers were North Korean or
