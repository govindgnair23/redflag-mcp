- id: 039_ofac_sham_transactions_advisory-03
  description: Unclear purpose of transfer. Transfers lacking apparent business purpose
    may indicate an attempt to obfuscate a blocked person’s continued interest in
    property. Likewise, transfers to an individual with little or no relevant experience
    or expertise with respect to the transferred property may be evidence of a sham
    transaction.
