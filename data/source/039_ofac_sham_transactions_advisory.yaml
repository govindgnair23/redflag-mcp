- id: 039_ofac_sham_transactions_advisory-02
  description: Transfer to family members or close associates. Transfers by a blocked
    person to a family member or close associate can be evidence of a sham transaction.
    Such family members or close associates may be acting as a proxy, facilitator,
    money manager, or agent for the blocked person. Similarly, the nature and scope
    of the relationship between the blocked person and a nominal owner of the transferred
    property may also be relevant. Formal or informal agreements, agent-principal
    or other close relationships, and other similar factors may indicate that the
    nominal owner is not independent from the blocked person and is instead holding
    property for, or acting on behalf of, the blocked person.
  product_types:
  - depository
