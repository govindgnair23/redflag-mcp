- id: 039_ofac_sham_transactions_advisory-07
  description: Evasive responses regarding a blocked person’s involvement. Evasive
    or vague responses, or failures to respond to questions from counterparties, key
    intermediaries, or gatekeepers regarding a blocked person’s involvement in property
    may be evidence of intent to conceal a continuing interest.
