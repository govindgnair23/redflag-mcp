- id: 039_ofac_sham_transactions_advisory-04
  description: Unduly complex corporate structures involving higher-risk jurisdictions.
    The presence of unnecessarily complex legal structures without a discernible legitimate
    purpose—such as certain multi-layered limited liability companies, partnerships,
    or trusts—may indicate an effort to conceal an ownership interest. This risk is
    heightened when holding entities are domiciled in jurisdictions that have little
    connection to the property they hold, lack robust regulatory and supervisory controls,
    or offer laws and structures that enable obfuscation in property ownership.
  product_types:
  - depository
  - private_banking
  - securities
