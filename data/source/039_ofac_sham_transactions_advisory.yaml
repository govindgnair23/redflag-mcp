- id: 039_ofac_sham_transactions_advisory-05
  description: Continued involvement of a blocked person. Facts or circumstances suggesting
    a blocked person remains involved in the use, management, or disposition of property—including
    through proxies or intermediaries—may indicate that the blocked person continues
    to retain an interest in property. In these situations, where a blocked person
    previously held an ownership interest in the property, the blocked person may
    still be behind legal structures designed to conceal their interest.
