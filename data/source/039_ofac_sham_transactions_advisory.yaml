- id: 039_ofac_sham_transactions_advisory-06
  description: Transfer near the time of designation. Transfers completed close in
    time to a person’s designation may trigger suspicion warranting further analysis,
    such as when a purported transfer occurs immediately before or after a designation.
    For example, shortly before or after being designated by OFAC, blocked drug kingpins
    have transferred shares in non-U.S. companies to offshore shell companies; such
    transfers should raise U.S. sanctions compliance concerns.
