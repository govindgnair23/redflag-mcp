  description: North Korea-flagged vessels sometimes manipulate the data transmitted
    via AIS. Such manipulation could include altering vessel names, IMO numbers, Maritime
    Mobile Service Identities (MMSIs), or other unique identifying information. This
    tactic can conceal a vessel’s next port of call or other information regarding
    its voyage.
