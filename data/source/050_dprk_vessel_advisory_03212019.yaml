- id: 050_dprk_vessel_advisory_03212019-01
  description: North Korea-flagged merchant vessels often intentionally disable their
    AIS transponders to mask their movements. Similarly, vessels with which North
    Korea conducts ship-to-ship transfers will typically disable AIS to evade detection
    to facilitate illicit trade. This tactic, whether employed by North Korea-flagged
    vessels or third-country vessels involved in trade with North Korea, is a red
    flag for potentially illicit activity, as it is a violation of international regulations
    and is often done to conceal the origin or destination of cargo associated with
    North Korea.
  product_types:
  - depository
  - wire_transfer
  - trade_finance
  - insurance
  industry_types:
  - maritime_shipping
  customer_profiles:
  - cross_border_business
  geographic_footprints:
  - east_asia
