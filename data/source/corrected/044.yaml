- id: 044-05
  description: A small bank in a jurisdiction with a strong trading relationship with
    Russia has a high number of customers in the import-export and microelectronics
    sectors that continue to do business with Russia. This bank maintains relationships
    with multiple designated Russian banks for the purpose of facilitating trade with
    Russia in the local currency. The activity going through this bank’s foreign correspondent
    relationships shows repeated linkages with Russia, a large volume of suspected
    shell company activity, and other general indicators of suspicious activity, such
    as wires with no clear business purpose involving high-risk jurisdictions.
  product_types:
  - correspondent_banking
  - wire_transfer
  - trade_finance
  industry_types:
  - import_export
  customer_profiles:
  - foreign_financial_institution
  - shell_or_front_company
  geographic_footprints:
  - russia
  - high_risk_jurisdiction
  regulatory_source: 'OFAC Sanctions Advisory: Updated Guidance for Foreign Financial
    Institutions on OFAC Sanctions Authorities Targeting Support to Russia’s Military-Industrial
    Base'
  regulator: OFAC
  regulator_jurisdiction: US
  issued_date: '2024-06-12'
  risk_level: high
  category: shell_company
  source_url: https://ofac.treasury.gov/media/932436/download
- id: 044-06
  description: A medium-sized bank in a jurisdiction with a strong trading relationship
    with Russia is reported in credible open-source media as taking steps to bring
    in new Russia-related business in order to capitalize on measures other banks
    have taken to reduce their Russia-related risk. These steps include opening a
    new representative office in Russia, expanding its Russian language promotional
    materials and website, and advertising in Russian-language media about services
    for Russian businesses.
  product_types:
  - correspondent_banking
  - wire_transfer
  industry_types: []
  customer_profiles:
