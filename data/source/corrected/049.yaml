- id: 049-04
  description: 'Disabling Automatic Identification System (AIS): AIS is a collision
    avoidance system, which transmits, at a minimum, a vessel’s identification and
    select navigational and positional data via very high frequency (VHF) radio waves.
    While AIS was not specifically designed for vessel tracking, it is often used
    for this purpose via terrestrial and satellite receivers feeding this information
    to commercial ship tracking services. Ships meeting certain tonnage thresholds
    and engaged in international voyages are required to carry and operate AIS; however,
    North Korean-flagged merchant vessels have been known to intentionally disable
    their AIS transponders to mask their movements. This tactic, whether employed
    by North Korean-flagged vessels or other vessels involved in trade with North
    Korea, could conceal the origin or destination of cargo destined for, or originating
    in, North Korea.'
  product_types:
