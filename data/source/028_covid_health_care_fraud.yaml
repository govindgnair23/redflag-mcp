- id: 028_covid_health_care_fraud-13
  description: A health care service provider starts receiving payments from laboratories
    and health care services companies, but there is no financial documentation (e.g.,
    operating expense payments) that the provider rendered legitimate services. When
    questioned, the provider indicates that he or she invested in the company and
    the payments are dividends or payments for services (e.g., a laboratory pays a
    physician for services related to a COVID-19 laboratory test). The tests, however,
    are not related to the physician’s specialization or do not normally require a
    physician’s involvement.
  product_types:
