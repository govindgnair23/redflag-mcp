- id: 028_covid_health_care_fraud-01
  description: 'After the COVID-19 public health emergency declaration, a health care
    service provider’s account receives or continues to receive: (1) health care benefit
    program or health insurance payments well above the provider’s estimated business
    transactions; or (2) payments at the same volume despite an expected diminished
    activity level during the public health emergency (e.g., a non-emergency medical
    transport company receiving higher than expected payments during stay-at-home
    orders).'
  product_types:
  - depository
  industry_types:
  - healthcare
  customer_profiles:
  - small_business
  geographic_footprints:
  - domestic_us
  regulatory_source: FIN-2021-A001 Advisory on COVID-19 Health Insurance- and Health
    Care-Related Fraud
  regulator: FinCEN
  regulator_jurisdiction: US
  issuing_agencies: []
  issued_date: '2021-02-02'
  risk_level: medium
  category: fraud_nexus
  source_url: https://www.fincen.gov/system/files/advisory/2021-02-02/COVID-19%20Health%20Care%20508%20Final.pdf
  typology_family:
  - fraud_proceeds
  transaction_patterns:
  - rapid_fund_movement
  key_terms:
  - health care benefit program
  - health insurance payments
  - COVID-19 public health emergency
- id: 028_covid_health_care_fraud-02
  description: A health care service provider’s account receives health care benefit
    program or health insurance payments beyond the expected type or volume of service,
    based on staffing and other characteristics of the business (e.g., processing
    COVID-19 tests when the medical facility does not typically offer diagnostic services,
    or the facility is processing a high volume of tests despite only employing a
    few medical personnel).
