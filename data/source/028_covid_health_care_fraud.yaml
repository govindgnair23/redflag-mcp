- id: 028_covid_health_care_fraud-14
  description: An account with no previous known association with providing health
    care services receives an unexpected or excessive COVID-19-related payment that
    appears to be the CARES Act’s Provider Relief Fund or the PPP-HCEA payments. Shortly
    after the account receives the deposit, an individual(s) withdraws the funds via
    large cash withdrawals, cashier’s checks, wires to an overseas account, transfers
    to personal accounts, or payments for non-business expenses.
