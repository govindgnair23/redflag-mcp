    large payments recorded as advertising or marketing expenses, or makes recurring
    round-dollar payments to one or multiple individuals in a manner inconsistent
    with its payroll-related withdrawals. The payments may reference “director fees,”
    “consulting fees,” “marketing,” or “business process outsourcing.”
